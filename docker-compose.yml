# Z-Trader on Coolify — one deployment, one domain.
#
#   Coolify: New resource → this repository → build pack "Docker Compose",
#            base directory "/", compose file "/docker-compose.yml".
#
# One public domain → `service` (NestJS API + the dashboard it serves, port 6500). MongoDB and
# zTraderActor have no domain and no published port; they are reached only inside the stack.
# Coolify generates the database passwords and the machine API key (SERVICE_* magic variables) on the
# first deploy and keeps them; you only fill in the cTrader account and the first admin.
# Full guide: zTraderService/docs/deploy.md ("Deploying on Coolify").
#
# Local equivalent with published ports: zTraderService/docker-compose.yml.

name: ztrader

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mongo:
    build:
      context: ./zTraderService/docker/mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MONGOROOT}
      # read by init-app-user.js on the first start (empty volume) only
      MONGO_APP_DB: ztrader
      MONGO_APP_USER: ztrader
      MONGO_APP_PASSWORD: ${SERVICE_PASSWORD_64_MONGOAPP}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # authenticates as the app user, so "healthy" also means the init script has created it
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --norc --host 127.0.0.1
          -u "$$MONGO_APP_USER" -p "$$MONGO_APP_PASSWORD" --authenticationDatabase "$$MONGO_APP_DB"
          --eval "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)" "$$MONGO_APP_DB"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  service:
    build:
      context: ./zTraderService
      args:
        REVISION: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Coolify routes the generated domain (or the one you set) to this service on port 6500.
      # The app does not read it.
      SERVICE_URL_SERVICE_6500: ${SERVICE_URL_SERVICE_6500}

      # --- generated by Coolify, do not edit ---
      MONGO_URI: mongodb://ztrader:${SERVICE_PASSWORD_64_MONGOAPP}@mongo:27017/ztrader?authSource=ztrader
      API_KEY: ${SERVICE_HEX_64_APIKEY}

      # --- behind Coolify's Traefik (one proxy hop, HTTPS terminated there) ---
      TRUST_PROXY: 1
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}

      # --- first admin: set for the first deploy, then delete both and redeploy ---
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      # --- trading account: DEMO unless BOTH switches say LIVE ---
      CTRADER_ACCOUNT_MODE: ${CTRADER_ACCOUNT_MODE:-DEMO}
      CTRADER_ALLOW_LIVE: ${CTRADER_ALLOW_LIVE:-false}
      APP_ID: ${APP_ID:?set APP_ID (cTrader Open API application)}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?set ACCESS_TOKEN}
      DEMO_ACCOUNT_ID: ${DEMO_ACCOUNT_ID:-}
      LIVE_ACCOUNT_ID: ${LIVE_ACCOUNT_ID:-}

      # --- the strategy loop runs in `actor`, inside this stack ---
      ACTOR_URL: http://actor:3000

      # --- optional integrations (empty = off) ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TV_AUTH_TOKEN: ${TV_AUTH_TOKEN:-}
      TV_USERNAME: ${TV_USERNAME:-}
      TV_PASSWORD: ${TV_PASSWORD:-}

      # recorded with every round and order (Coolify: enable "Include Source Commit in Build")
      APP_COMMIT: ${SOURCE_COMMIT:-}

      # --- storage, fixed to the volumes below ---
      GOLD_ARCHIVE_DIR: /app/archive
      GOLD_SETTINGS_FILE: /app/data/runtime-settings.json
    volumes:
      - archive:/app/archive
      - data:/app/data
    networks:
      - db
      - default
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
    # time for the shutdown hooks to close the cTrader socket and MongoDB
    stop_grace_period: 30s
    logging: *logging

  actor:
    build:
      context: ./zTraderActor
    restart: unless-stopped
    depends_on:
      service:
        condition: service_healthy
    environment:
      API_TRADER_URL: http://service:6500
      API_KEY: ${SERVICE_HEX_64_APIKEY}
      PORT: 3000
      TRUST_PROXY: 0
    # no domain: the dashboard drives it through /api/actor (Strategy page); no route to MongoDB
    networks:
      - default
    init: true
    <<: *hardening
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *logging

networks:
  # internal: no route in or out. Only mongo and service are attached.
  db:
    internal: true
  default: {}

volumes:
  mongo-data:
  mongo-config:
  archive:
  data:
