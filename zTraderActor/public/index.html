<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Z Trader — Gold Bot</title>
        <link rel="stylesheet" href="/styles.css" />
        <script src="/socket.io/socket.io.js" defer></script>
        <script type="module" src="/app.js"></script>
    </head>
    <body>
        <section id="loginView" class="card login" hidden>
            <h2>Z Trader — Sign in</h2>
            <form id="loginForm" autocomplete="on">
                <label for="loginUser">Username</label>
                <input
                    id="loginUser"
                    name="username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                    maxlength="32"
                />
                <label for="loginPass">Password</label>
                <input
                    id="loginPass"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    maxlength="128"
                />
                <button class="btn-run" id="btnLogin" type="submit">Sign in</button>
                <div class="msg" id="loginMsg" role="alert"></div>
            </form>
            <p class="muted note">Accounts are managed on the main Z Trader dashboard.</p>
        </section>

        <div id="appView" hidden>
            <header>
                <h1>Z Trader</h1>
                <span id="accBadge" class="badge demo">…</span>
                <span id="engineBadge" class="badge engine">…</span>
                <span class="muted"><span id="ctDot" class="dot off"></span>cTrader</span>
                <span class="spacer"></span>
                <span class="price" id="price">—</span>
                <span id="userBadge" class="badge role"></span>
                <button class="header-btn" id="btnLogout" type="button">Sign out</button>
            </header>
            <main>
                <div>
                    <div class="card">
                        <h2>Gold Bot Control</h2>
                        <div class="readonly" id="readonlyNote" hidden>
                            Read-only: your role is viewer. Ask an admin for operator access to trade.
                        </div>
                        <label for="modeSel">Mode (for single Run)</label>
                        <select id="modeSel"></select>
                        <div class="modehint" id="modeHint"></div>
                        <div class="row">
                            <button class="btn-run op" id="btnRun" type="button">▶ Run once</button>
                        </div>
                        <label class="label-gap">Auto loop — select modes</label>
                        <div class="checks" id="loopChecks"></div>
                        <div class="row">
                            <button class="btn-start op" id="btnStart" type="button">Start Auto Loop</button>
                            <button class="btn-stop op" id="btnStop" type="button" hidden>Stop Auto Loop</button>
                        </div>
                    </div>
                    <div class="card">
                        <h2>⚠️ Acceptable risk</h2>
                        <div class="setgrid">
                            <label
                                >Risk per trade ($)<input class="op" type="number" id="s_risk" step="10" min="1"
                            /></label>
                            <label
                                >Max loss/day ($)<input class="op" type="number" id="s_daily" step="50" min="0"
                            /></label>
                            <label
                                >Max open positions<input
                                    class="op"
                                    type="number"
                                    id="s_maxpos"
                                    step="1"
                                    min="1"
                                    max="20"
                            /></label>
                            <label
                                >Max scalps/day<input class="op" type="number" id="s_scalp" step="1" min="1" max="50"
                            /></label>
                            <label
                                >Min confidence<input class="op" type="number" id="s_conf" step="1" min="0" max="10"
                            /></label>
                            <label
                                >Max lot<input class="op" type="number" id="s_maxlot" step="0.01" min="0.01"
                            /></label>
                        </div>
                        <div class="row">
                            <button class="btn-save op" id="btnSave" type="button">💾 Save risk settings</button>
                        </div>
                        <div class="muted note" id="setNote"></div>
                    </div>
                    <div class="card">
                        <h2>Live Stats <span class="muted" id="statTime"></span></h2>
                        <div class="statgrid" id="statGrid"><div class="muted">Loading…</div></div>
                    </div>
                    <div class="card">
                        <h2>Open Positions (XAUUSD)</h2>
                        <div id="positions" class="muted">—</div>
                    </div>
                    <div class="card arch">
                        <h2>Latest archive</h2>
                        <div id="archList" class="muted">—</div>
                    </div>
                </div>
                <div>
                    <div class="card log-card">
                        <h2>System Log</h2>
                        <div id="log"></div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
